  # Answers for "Ask me": the questions an interviewer would ask, answered in the owner's own words
  # (the copy interview, 2026-09-30). The tools answer says "delivered with" on purpose: some were
  # used hands-on and some alongside developers, and it must not claim otherwise.
  # Set draft back to true to show the section only in preview builds.
  interview:
    draft: false
    questions:
      - question: What role are you after?
        answer: >-
          An AI product role where I'm creating products with AI, and in time leading a team that does
          the same. I'd love to join an AI startup, and I'm open to larger companies too. Ideally
          hybrid or remote.
      - question: A project you're proud of?
        answer: >-
          Leading automation for a UK healthcare group. We cut a lot of manual back-office work and
          sped up turnaround times. What I liked most is that people actually used it.
      - question: How do you tackle a messy process?
        answer: >-
          I sit with the people who do the work and map what really happens, not what the document
          says. Then we agree what's worth fixing, design the better version, and deliver it in small
          steps, with training so it sticks.
      - question: How do you build with AI?
        answer: >-
          I start by writing down the problem and what good looks like. Then I build with AI coding
          tools like Claude Code or Codex, review what they produce, test it properly, and get it in
          front of real users early. This site, Brandgrabit and DigiBlu's website were built that way.
      - question: Which tools have you worked with?
        answer: >-
          I've delivered client projects with Microsoft 365, Power Apps, Power BI, RPA platforms and
          APIs, some hands-on and some alongside developers. I plan and document work in Jira and
          Confluence, and use Microsoft 365 Copilot and Copilot Studio. For my own builds I use Claude
          Code and Codex, with GitHub, Cloudflare, Vercel, Supabase and Sentry.
      - question: What are you learning?
        answer: >-
          Agentic AI: automations that can work through a task rather than follow a fixed script.
          I'm also going deeper on Power Automate.
      - question: Life outside work?
        answer: >-
          Boxing, which I'm a bit obsessed with, plus the gym and sauna most mornings. I travel when
          I can, and there's usually a side build on the go in the evenings.

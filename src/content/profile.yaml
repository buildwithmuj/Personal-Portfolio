  # DRAFT answers for "Interview me", drawn from the CV, skills and method; Mujtaba to rewrite them
  # in Mujtaba's own words. While draft is true the section shows only in preview builds.
  interview:
    draft: true
    questions:
      - question: What role are you after?
        answer: >-
          A senior role where automation, AI and product meet: leading an intelligent automation
          programme, or owning an AI product from the first problem to version one. I'm also open to
          projects where a process needs untangling.
      - question: Proudest project?
        answer: >-
          Leading automation for a UK healthcare group, where RPA and workflow tools cut manual work
          and improved turnaround times. What matters most to me is that it gets used, not just
          delivered.
      - question: How do you tackle a messy process?
        answer: >-
          I start with the real process, not the documented one, mapping how the work actually
          happens with the people who do it. Then I design the future state, build the business case
          so the right people can say yes, and deliver in small, tested steps. Finally I embed it,
          with the SOPs and adoption support that make the change stick.
      - question: How do you build a product?
        answer: >-
          From a real problem people actually have, checked before I build anything. I prototype
          fast with low-code, no-code and AI tools, put it in front of real users early, ship the
          smallest version that solves it well, then measure, listen and improve, or retire it and
          carry the lessons forward.
      - question: Which tools do you use?
        answer: >-
          RPA, APIs and Power Apps for automation, Power BI for data products, and low-code, no-code
          and AI tools to build products fast. I'm a Certified ScrumMaster and Professional Scrum
          Product Owner, so agile delivery is second nature.
      - question: What are you learning?
        answer: >-
          Agentic AI workflows: automations that can reason about a task instead of only following a
          script. I'm putting them to work at DigiBlu, and on this site.
      - question: Life outside work?
        answer: >-
          I box at Legends MMA, speak four languages and I'm always building something on the side.
          Boxing keeps me calm under pressure, which helps on go-live day too.

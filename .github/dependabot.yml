version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is unsupported by @astrojs/check (spec §3/§15).
      - dependency-name: typescript
        versions: ['>=7']
      # The runtime is Node 24.
      - dependency-name: '@types/node'
        versions: ['>=25']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

name: ci

# The checks run in parallel jobs. The last job, `ci`, passes only when every other job has: the
# main ruleset requires a status check with exactly that name, and pages.yml deploys when this
# workflow (also named ci) succeeds on main. Keep both names.
on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  static:
    name: static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

  build:
    name: build and links
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The live site is served under /Personal-Portfolio (spec §15, 2026-09-26). Build it the way
      # pages.yml does and fail if any internal URL skips the base path; the tests build at /.
      - name: Check the GitHub Pages build keeps the base path
        env:
          PAGES_SITE: https://buildwithmuj.github.io
          PAGES_BASE: /Personal-Portfolio
        run: |
          pnpm build
          if grep -rPo '(?:href|src|srcset|action|content)="/(?!Personal-Portfolio/|/)[^"]*"' dist --include='*.html'; then
            echo 'The URLs above skip the /Personal-Portfolio base path. Wrap them in withBase().'
            exit 1
          fi
      - run: pnpm build
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --offline --root-dir ${{ github.workspace }}/dist dist
          fail: true

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Let every browser finish, so one browser's failure doesn't hide another's.
      fail-fast: false
      matrix:
        # The projects in package.json's test:e2e; tests/unit/workflows.test.ts keeps them in step.
        browser: [chromium, webkit, firefox]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # dist is what the Playwright web server (pnpm serve) serves.
      - run: pnpm build
      - name: Read the Playwright version
        id: playwright
        run: |
          version="$(pnpm exec playwright --version)"
          version="${version#Version }"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unexpected Playwright version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The browser builds depend only on the Playwright version. The system libraries aren't
      # cached, so they're installed either way.
      - name: Cache the Playwright browser
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ env.BROWSER }}
      - name: Install the browser and its system libraries
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps "$BROWSER"
      - name: Install the cached browser's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps "$BROWSER"
      - run: pnpm exec playwright test --project="$BROWSER"

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BROWSER: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Read the Playwright version
        id: playwright
        run: |
          version="$(pnpm exec playwright --version)"
          version="${version#Version }"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unexpected Playwright version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Shares the chromium end-to-end job's cache entry.
      - name: Cache the Playwright browser
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ env.BROWSER }}
      - name: Install the browser and its system libraries
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps "$BROWSER"
      - name: Install the cached browser's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps "$BROWSER"
      - run: pnpm test:perf

  ci:
    name: ci
    needs: [static, build, e2e, lighthouse]
    # Always runs, even after a failure or a cancellation, because a skipped required check counts
    # as passed.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo 'Every job must succeed for ci to pass.'
              exit 1
            fi
          done

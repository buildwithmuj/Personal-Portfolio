name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      # The live site is served under /Personal-Portfolio (spec §15, 2026-09-26). Build it the way
      # pages.yml does and fail if any internal URL skips the base path; the tests below build at /.
      - name: Check the GitHub Pages build keeps the base path
        env:
          PAGES_SITE: https://buildwithmuj.github.io
          PAGES_BASE: /Personal-Portfolio
        run: |
          pnpm build
          if grep -rPo '(?:href|src|srcset|action|content)="/(?!Personal-Portfolio/|/)[^"]*"' dist --include='*.html'; then
            echo 'The URLs above skip the /Personal-Portfolio base path. Wrap them in withBase().'
            exit 1
          fi
      - run: pnpm build
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --offline --root-dir ${{ github.workspace }}/dist dist
          fail: true
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - run: pnpm test:e2e
      - run: pnpm test:perf

name: pages

# Builds main in production mode and deploys it to GitHub Pages, the live site, at
# https://buildwithmuj.github.io/Personal-Portfolio/. A push to main goes live only after ci passes on
# it. (The weather beside the clock refreshes in visitors' browsers, so no scheduled rebuild.)
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, each allowed to finish: a deploy cancelled part-way can leave Pages
# half-published. A newer run waits instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Only the commit main points at now goes live. Re-running an older ci run (it passes again, and
  # fires this workflow) must not roll the live site back to that commit.
  current:
    name: current
    # After ci: only a successful run for a push to main in this repository (never a fork's branch).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.main.outputs.deploy }}
    steps:
      - id: main
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        # Named, bash runs with pipefail (the default is bash -e without it), so a failed ls-remote
        # fails the step, loudly.
        shell: bash
        run: |
          main=$(git ls-remote "https://github.com/$REPOSITORY" refs/heads/main | cut -f1)
          if [ -z "$main" ]; then
            echo "::error::Could not read main's commit, so nothing was deployed."
            exit 1
          fi
          # A manual run has no tested commit, and builds main itself.
          if [ -z "$TESTED" ] || [ "$TESTED" = "$main" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not deploying $TESTED: main is now $main."
          fi

  build:
    name: build
    needs: current
    if: needs.current.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit ci tested; manual builds take main whatever the default branch is.
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          PAGES_SITE: https://buildwithmuj.github.io
          PAGES_BASE: /Personal-Portfolio
          # WORKERS_CI_BRANCH stays unset, so the build is production (indexable, placeholders hidden,
          # spec §8).
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # Keeps .well-known/security.txt, which the artifact would otherwise drop.
          include-hidden-files: true

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only write access in any workflow: what GitHub Pages needs to publish, in this job alone.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

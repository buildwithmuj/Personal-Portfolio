name: pages

# Builds main in production mode and deploys it to GitHub Pages, the live site, at
# https://buildwithmuj.github.io/Personal-Portfolio/. A push to main goes live only after ci passes on
# it. The site also rebuilds hourly, so London's weather (fetched at build time) stays current;
# GitHub pauses schedules after 60 days without repository activity.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    # After ci: only a successful run for a push to main in this repository (never a fork's branch).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit ci tested; hourly and manual builds take main whatever the default branch is.
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          PAGES_SITE: https://buildwithmuj.github.io
          PAGES_BASE: /Personal-Portfolio
          # WORKERS_CI_BRANCH stays unset, so the build is production (indexable, placeholders hidden,
          # spec §8).
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # Keeps .well-known/security.txt, which the artifact would otherwise drop.
          include-hidden-files: true

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only write access in any workflow: what GitHub Pages needs to publish, in this job alone.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

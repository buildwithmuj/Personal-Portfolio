# Supply-chain settings (spec §7). Don't relax them without the owner's approval.
minimumReleaseAge: 10080 # minutes: a version must be 7 days old before it can be installed
strictDepBuilds: true # fail the install when a dependency has an unreviewed build script
engineStrict: true
onlyBuiltDependencies: # reviewed packages allowed to run install scripts (native binaries)
  - esbuild
  - sharp
  - workerd
# The local test server (wrangler, through miniflare) pins undici 7.29.0, which has six security
# advisories fixed in 7.29.1. The wrangler releases that carry the fix are younger than seven days,
# so this lifts that one package instead. Remove it once wrangler is at 4.143.1 or later.
overrides:
  miniflare>undici: 7.29.1
